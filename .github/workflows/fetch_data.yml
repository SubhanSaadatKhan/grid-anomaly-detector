name: Fetch ENTSO-E Data

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:         # manual trigger button
    inputs:
      backfill_days:
        description: 'How many days back to re-fetch (fills gaps from past outages)'
        required: false
        default: '3'

permissions:
  contents: write            # needed to commit the updated CSV

# Never let two runs write grid_load.csv at the same time.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install entsoe-py pandas

      - name: Fetch latest data
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python data/update_data.py

      - name: Commit if new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/grid_load.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: auto-update grid load data"
          # main may have moved while we were fetching; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
